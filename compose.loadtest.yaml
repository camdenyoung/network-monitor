# Run benchmark-monitor on the Pi; simulator runs on a DIFFERENT computer.
# Use -p network-monitor-loadtest so its volume is separate from normal monitoring.
services:
  benchmark-monitor:
    build: .
    ports:
      - "${BENCHMARK_BIND:-0.0.0.0}:${BENCHMARK_PORT:-8081}:8080"
    volumes:
      - benchmark-data:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      MONITOR_DATA: /data
      MONITOR_ADMIN_PASSWORD: benchmark-only-password
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    init: true
  simulator:
    profiles: [simulator]
    build: .
    command: [python, -m, tools.load_test, serve, --scenario, "${BENCHMARK_SCENARIO:-healthy}", --latency-ms, "${BENCHMARK_LATENCY_MS:-10}", --failure-percent, "${BENCHMARK_FAILURE_PERCENT:-10}"]
    ports:
      - "161:1161/udp"
      - "502:1502/tcp"
    init: true
volumes:
  benchmark-data:
