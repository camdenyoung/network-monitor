<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Field Monitor · Status</title><style>
    :root { color-scheme: dark; font: 15px system-ui, sans-serif; background: #101823; color: #e8eff8; }
    body { max-width: 1250px; margin: auto; padding: 28px; }
    header, .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h1 { margin-bottom: 4px; } h2 { font-size: 20px; } p, small { color: #a9bad0; }
    section, article { border: 1px solid #314257; background: #182433; border-radius: 10px; padding: 18px; margin: 16px 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; }
    .grid article { margin: 0; } form { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
    [hidden] { display: none !important; }
    label { display: grid; gap: 5px; font-size: 13px; }
    input, select, textarea, button { font: inherit; color: inherit; border: 1px solid #435b78; border-radius: 5px; padding: 9px; background: #101b29; max-width: 100%; }
    button { cursor: pointer; } button:hover { background: #29445c; } button.primary { background: #176959; }
    .healthy { color: #64dfad; } .warning { color: #ffcb69; } .critical, .unreachable { color: #ff8b96; }
    .blocked { color: #a9bad0; } .unknown { color: #b6c3d6; } .metric { padding: 12px 0; border-top: 1px solid #314257; }
    .metric button { padding: 4px 8px; margin-left: 8px; } #message { color: #ffcb69; min-height: 22px; }
    #message.success, .form-feedback.success { color: #64dfad; }
    .form-feedback { display: block; margin-top: 10px; color: #ffcb69; }
    button:disabled { opacity: 0.5; cursor: wait; }
    details { margin: 18px 0; } summary { cursor: pointer; padding: 8px 0; }
    table { width: 100%; border-collapse: collapse; } td, th { text-align: left; padding: 9px; border-bottom: 1px solid #314257; }
    .metric-header { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
    .metric-status { display: block; margin-top: 4px; font-size: 13px; }
    .metric-value { font-size: 21px; margin: 8px 0 3px; }
    details.action-menu { position: relative; margin: 0; flex-shrink: 0; }
    .action-menu summary { padding: 5px 9px; border: 1px solid #435b78; border-radius: 5px; font-size: 13px; }
    .action-menu .menu-buttons { position: absolute; right: 0; top: 34px; z-index: 10; display: grid; gap: 4px; min-width: 170px; padding: 8px; background: #101b29; border: 1px solid #435b78; border-radius: 6px; box-shadow: 0 8px 24px #0008; }
    .action-menu .menu-buttons button { text-align: left; margin: 0; padding: 8px; }
    #history { width: 880px; box-sizing: border-box; }
    #history-graph svg { display: block; width: 100%; height: auto; }
    .view-tabs { display: flex; gap: 8px; margin: 14px 0; }
    .view-tabs button[aria-pressed="true"] { background: #176959; }
    .scroll { overflow: auto; } dialog { background: #182433; color: #e8eff8; border: 1px solid #435b78; max-width: 90vw; }
    a { color: #7cddd0; } code { color: #b7d6ff; }
  </style></head>
<body>
  <header><div><h1>Network status</h1><p id="project">Loading…</p></div><a href="/">Sign in / dashboard</a></header>
  <p id="summary" role="status"></p>
  <section aria-labelledby="incidents-title">
    <h2 id="incidents-title">Active incidents</h2>
    <div id="incidents" aria-live="polite"></div>
  </section>
  <div id="devices" class="grid"></div><p id="updated"></p>
  <script>
    const escape = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const labels = {healthy:'Online',unreachable:'Offline',unknown:'Unknown / paused',blocked:'Suppressed'};
    async function refresh() {
      try {
        const response = await fetch('/api/status');
        if (!response.ok) throw new Error('Status service unavailable');
        const data = await response.json();
        document.getElementById('project').textContent = data.project || 'Monitoring paused';
        const online = data.devices.filter(device => device.status === 'healthy').length;
        document.getElementById('summary').textContent = `${online} of ${data.devices.length} displayed hosts online`;
        document.getElementById('incidents').innerHTML = data.incidents.map(incident => `
          <div class="metric">
            <strong class="${escape(incident.status)}">${escape(labels[incident.status] || incident.status)}</strong>
            · ${escape(incident.device)} - ${escape(incident.alias)} / ${escape(incident.service)}
            <small>· Since ${escape(new Date(incident.opened * 1000).toLocaleString())}</small>
          </div>`).join('') || '<p>No active incidents.</p>';
        document.getElementById('devices').innerHTML = data.devices.map(device => `<article><h2>${escape(device.name)} - ${escape(device.alias)}</h2><p class="${escape(device.status)}">${escape(labels[device.status] || device.status)}</p>${device.services.map(service => `<div class="metric"><strong>${escape(service.name)}</strong><p class="${escape(service.status)}">${escape(service.value ?? labels[service.status] ?? service.status)} ${escape(service.units)} · ${escape(service.status)}</p></div>`).join('')}</article>`).join('') || '<section>No active equipment to display.</section>';
        document.getElementById('updated').textContent = 'Updated ' + new Date(data.updated * 1000).toLocaleString();
      } catch (error) {
        document.getElementById('summary').textContent = error.message + ' — displayed information may be stale.';
      }
    }
    refresh(); setInterval(refresh,10000);
  </script>
</body></html>
