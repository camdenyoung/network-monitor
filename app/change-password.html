<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Network Monitor · Change Password</title><style>
    :root { color-scheme: dark; font: 15px system-ui, sans-serif; background: #101823; color: #e8eff8; }
    body { max-width: 1250px; margin: auto; padding: 28px; }
    header, .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h1 { margin-bottom: 4px; } h2 { font-size: 20px; } p, small { color: #a9bad0; }
    section, article { border: 1px solid #314257; background: #182433; border-radius: 10px; padding: 18px; margin: 16px 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; }
    .grid article { margin: 0; } form { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
    [hidden] { display: none !important; }
    label { display: grid; gap: 5px; font-size: 13px; }
    input, select, textarea, button, .button-link { font: inherit; color: inherit; border: 1px solid #435b78; border-radius: 5px; padding: 9px; background: #101b29; max-width: 100%; }
    button { cursor: pointer; } button:hover, .button-link:hover { background: #29445c; } button.primary { background: #176959; }
    .healthy { color: #64dfad; } .warning { color: #ffcb69; } .critical, .unreachable { color: #ff8b96; }
    .blocked { color: #a9bad0; } .unknown { color: #b6c3d6; } .metric { padding: 12px 0; border-top: 1px solid #314257; }
    .metric button { padding: 4px 8px; margin-left: 8px; } #message { color: #ffcb69; min-height: 22px; }
    #message.success, .form-feedback.success { color: #64dfad; }
    .form-feedback { display: block; margin-top: 10px; color: #ffcb69; }
    button:disabled { opacity: 0.5; cursor: wait; }
    details { margin: 18px 0; } summary { cursor: pointer; padding: 8px 0; }
    table { width: 100%; border-collapse: collapse; } td, th { text-align: left; padding: 9px; border-bottom: 1px solid #314257; }
    .metric-header { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
    .metric-status { display: block; margin-top: 4px; font-size: 13px; }
    .metric-value { font-size: 21px; margin: 8px 0 3px; }
    details.action-menu { position: relative; margin: 0; flex-shrink: 0; }
    .action-menu summary { padding: 5px 9px; border: 1px solid #435b78; border-radius: 5px; font-size: 13px; }
    .action-menu .menu-buttons { position: absolute; right: 0; top: 34px; z-index: 10; display: grid; gap: 4px; min-width: 170px; padding: 8px; background: #101b29; border: 1px solid #435b78; border-radius: 6px; box-shadow: 0 8px 24px #0008; }
    .action-menu .menu-buttons button { text-align: left; margin: 0; padding: 8px; }
    #history { width: 880px; box-sizing: border-box; }
    #history-graph svg { display: block; width: 100%; height: auto; }
    .view-tabs { display: flex; gap: 8px; margin: 14px 0; }
    .view-tabs button[aria-pressed="true"] { background: #176959; }
    .scroll { overflow: auto; } dialog { background: #182433; color: #e8eff8; border: 1px solid #435b78; max-width: 90vw; }
    .button-link { display: inline-flex; align-items: center; justify-content: center; color: inherit; text-decoration: none; line-height: normal; box-sizing: border-box; }
    button:focus-visible, .button-link:focus-visible { outline: 2px solid #7cddd0; outline-offset: 3px; }
    a { color: #7cddd0; } code { color: #b7d6ff; }
    #password-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    #password-form label { min-width: 0; }
    #password-form input { width: 100%; box-sizing: border-box; }
    .password-actions { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; }
    @media (max-width: 460px) {
      #password-form { grid-template-columns: minmax(0, 1fr); }
    }
  </style></head>
<body style="max-width:620px">
  <h1>Network Monitor</h1><p><a class="button-link" href="/status">Public status overview</a></p>
  <section><h2>Change your password</h2>
    <p id="password-reason">Choose a password with at least 10 characters.</p>
    <form id="password-form" method="post" hidden>
      <label>Username<input name="username" readonly autocomplete="username"></label>
      <label>Current password<input name="current_password" type="password" required autocomplete="current-password"></label>
      <label>New password<input name="password" type="password" minlength="10" maxlength="256" required autocomplete="new-password"></label>
      <label>Confirm new password<input name="confirm" type="password" minlength="10" maxlength="256" required autocomplete="new-password"></label>
      <div class="password-actions">
        <button type="submit">Save password</button>
        <a id="back-dashboard" class="button-link" href="/" hidden>Cancel</a>
      </div>
    </form>
  </section>
  <p id="message" role="status"></p>
  <script>
    const requestedDestination = new URLSearchParams(location.search).get('next');
    const returnDestination = requestedDestination === '/status' ? '/status' : '/';
    const loginDestination = '/login' + (returnDestination === '/status' ? '?next=%2Fstatus' : '');
    const form = document.getElementById('password-form');
    const button = form.querySelector('button');
    let user;
    async function loadSession() {
      const response = await fetch('/api/me');
      if (response.status === 401) {
        location.assign(loginDestination);
        return;
      }
      if (!response.ok) throw new Error('Could not verify your session. Refresh to try again.');
      user = await response.json();
      // Associate this change with the account without exposing any stored password.
      form.elements.namedItem('username').value = user.username;
      form.hidden = false;
      const back = document.getElementById('back-dashboard');
      back.setAttribute('href', returnDestination);
      back.hidden = Boolean(user.must_change_password);
      if (user.must_change_password) {
        document.getElementById('password-reason').textContent = 'Change your temporary password before continuing.';
      }
    }
    form.onsubmit = async event => {
      event.preventDefault();
      if (!user || button.disabled) return;
      button.disabled = true;
      document.getElementById('message').textContent = '';
      try {
        const body = Object.fromEntries(new FormData(form));
        if (body.confirm !== body.password) throw new Error('New passwords do not match.');
        const response = await fetch('/api/password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-CSRF-Token': user.csrf},
          body: JSON.stringify(body),
        });
        if (response.status === 401) {
          location.assign(loginDestination);
          return;
        }
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Could not change your password.');
        // The server rotates the session; navigate without clearing the password fields.
        location.assign(returnDestination);
      } catch (error) {
        document.getElementById('message').textContent = error.message;
      } finally {
        button.disabled = false;
      }
    };
    loadSession().catch(error => { document.getElementById('message').textContent = error.message; });
  </script>
</body></html>
