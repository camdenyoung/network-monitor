<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Network Monitor · Login</title>
  <link rel="stylesheet" href="/static/css/base.css?v=112">
  <link rel="stylesheet" href="/static/css/auth.css?v=112">
</head>
<body class="auth-page">
  <h1>Network Monitor</h1><p><a class="button-link" href="/status">Public status overview</a></p>
  <section><h2>Sign in</h2>
    <form id="login-form" method="post">
      <label>Username<input name="username" required autocomplete="username"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
      <button type="submit">Sign in</button>
    </form>
    <p>First login: username <code>admin</code>. Obtain the temporary password from the server administrator.</p>
  </section>
  <p id="message" role="status"></p>
  <script>
    // Keep the dashboard destination local and preserve it through mandatory changes.
    const requestedDestination = new URLSearchParams(location.search).get('next');
    const returnDestination = requestedDestination === '/status' ? '/status' : '/';
    const passwordDestination = '/change-password' + (returnDestination === '/status' ? '?next=%2Fstatus' : '');
    const form = document.getElementById('login-form');
    const button = form.querySelector('button');
    let loginRevision = 0;
    let sessionCheck = null;
    let navigating = false;

    function routeSession(user) {
      navigating = true;
      location.replace(user.must_change_password ? passwordDestination : returnDestination);
    }

    async function readSession(signal) {
      const response = await fetch('/api/me', {
        credentials: 'same-origin', cache: 'no-store', signal,
      });
      if (response.status === 401) return null;
      if (!response.ok) throw new Error('Could not verify your session. Please try again.');
      return response.json();
    }

    function restoreSession() {
      if (button.disabled || navigating) return Promise.resolve();
      if (sessionCheck) return sessionCheck;
      const revision = loginRevision;
      const controller = new AbortController();
      // Bound both the request and JSON read; failure must leave sign-in usable.
      const timeout = setTimeout(() => controller.abort(), 8000);
      sessionCheck = (async () => {
        try {
          const user = await readSession(controller.signal);
          // A page-load response must never overtake a newer credential submission.
          if (user && revision === loginRevision && !button.disabled && !navigating) {
            routeSession(user);
          }
        } catch (error) {
          if (revision === loginRevision && !button.disabled && !navigating) {
            document.getElementById('message').textContent = 'Could not check your existing session. You can still sign in or retry by reloading.';
          }
        } finally {
          clearTimeout(timeout);
          sessionCheck = null;
        }
      })();
      return sessionCheck;
    }

    form.onsubmit = async event => {
      event.preventDefault();
      if (button.disabled || navigating) return;
      loginRevision += 1;
      button.disabled = true;
      document.getElementById('message').textContent = '';
      try {
        const response = await fetch('/api/login', {
          method: 'POST', credentials: 'same-origin',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(Object.fromEntries(new FormData(form))),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Could not sign in.');
        const user = await readSession();
        if (!user) throw new Error('Could not verify your session. Please try again.');
        // Leave credentials intact until navigation so password managers can capture them.
        routeSession(user);
      } catch (error) {
        document.getElementById('message').textContent = error.message;
      } finally {
        button.disabled = false;
      }
    };
    // Navigation cookies alone are insufficient: check from the loaded same-origin page.
    // Also reconcile restored/backgrounded mobile tabs without extending session expiry.
    globalThis.addEventListener?.('pageshow', () => restoreSession());
    document.addEventListener?.('visibilitychange', () => {
      if (!document.hidden) restoreSession();
    });
    restoreSession();
  </script>
</body></html>
